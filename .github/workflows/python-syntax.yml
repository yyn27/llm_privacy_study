name: Python syntax validation
on:
  push:
    paths:
      - 'scripts/**'
      - 'configs/*.py'
      - 'tests/**'
      - '.github/workflows/python-syntax.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python source without downloading models
        run: python -m compileall -q scripts configs tests env_check.py
